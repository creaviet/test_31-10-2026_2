<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kundenportal — Passkey wiederherstellen</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Kundenportal</span>
    <span class="prototype-badge">Prototyp</span>
  </header>
  <main id="main" tabindex="-1">
    <section class="card">
      <h1>Neuen Passkey registrieren</h1>
      <p>Nach erfolgreicher Überprüfung können Sie nun einen neuen Passkey für Ihr Konto registrieren.</p>
      <button id="btn-recover-reg" type="button" class="primary">Passkey einrichten</button>
      <p id="recovery-reg-hint" class="hint" role="status" hidden>Bitte schließen Sie die Anmeldung am Gerät ab.</p>
      <p><a href="/">Zurück zur Startseite</a></p>
    </section>
  </main>
  <footer class="footer">Prototyp — keine echten Daten.</footer>
  <script src="/recovery/register.js" defer></script>
</body>
</html>
